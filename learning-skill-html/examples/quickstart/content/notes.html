<h1>请求处理主笔记</h1>
<p>核心口诀：<strong>先进队，后处理，再返回</strong>。顺序变化不是排版问题，而是系统语义变化。</p>

<h2>累计比喻地图</h2>
<pre><code>饭馆
├─ 顾客 ───────── 请求
├─ 等候区 ─────── 队列
├─ 服务窗口 ───── 处理器
└─ 出餐口 ─────── 响应</code></pre>
